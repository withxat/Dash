pre-commit:
  # swift-format rewrites source files in place, so running it beside Xcode can
  # make the compiler observe a partially replaced file.
  parallel: false
  jobs:
    - name: lint & format
      glob: '**/*.{swift,js,ts,jsx,tsx,astro,htm,html,json,yml,yaml,toml,css,pcss,postcss,less,scss,md,xml,svg,gql,graphql}'
      run: pnpm lint:fix
      stage_fixed: true

    # `/usr/bin/git` is an xcrun shim, so every hook it spawns inherits
    # SDKROOT=/Library/Developer/CommandLineTools/SDKs/MacOSX.sdk (plus CPATH
    # and LIBRARY_PATH). That SDK ships no SwiftUI macro plugins, so any SwiftPM
    # build of a package using `@Entry` or `#Preview` — BlossomColorPicker today
    # — dies with "plugin for module 'SwiftUIMacros' not found" inside the hook
    # and nowhere else. Strip the shim's vars so the toolchain picks its own SDK.
    - name: typecheck
      run: env -u SDKROOT -u CPATH -u LIBRARY_PATH pnpm typecheck
      glob: '**/*.{swift,ts,tsx,js,jsx,pbxproj,xcconfig}'
