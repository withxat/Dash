linkWorkspacePackages: true
nodeLinker: hoisted
shellEmulator: true
trustPolicy: no-downgrade
packages:
  - packages/*
  - apps/*
catalogs:
  devtool:
    '@withxat/eslint-config': ^1.1.5
    '@withxat/tsconfig': ^1.0.4
    eslint: ^10.6.0
    jiti: ^2.7.0
    lefthook: ^2.1.9
    turbo: ^2.10.2
    typescript: ^6.0.3
  react:
    '@types/react': ^19.2.17
    '@types/react-dom': ^19.2.3
    react: ^19.2.7
    react-dom: ^19.2.7
  tailwind:
    tailwindcss: ^4.3.2
  mobile:
    '@expo/log-box': ^57.0.0
    '@expo/metro-runtime': ^57.0.2
    '@tanstack/react-query': ^5.101.2
    babel-preset-expo: ~57.0.1
    expo: ^57.0.1
    expo-asset: ^57.0.2
    expo-auth-session: ^57.0.1
    expo-constants: ^57.0.2
    expo-crypto: ^57.0.0
    expo-font: ^57.0.0
    expo-linking: ^57.0.1
    expo-router: ^57.0.2
    expo-secure-store: ^57.0.0
    expo-splash-screen: ^57.0.1
    expo-status-bar: ^57.0.0
    expo-system-ui: ^57.0.0
    expo-web-browser: ^57.0.0
    nativewind: ^4.2.6
    react-dom: ^19.2.7
    react-native: ^0.86.0
    react-native-gesture-handler: ^3.0.2
    react-native-reanimated: ^4.5.0
    react-native-safe-area-context: ^5.8.0
    react-native-screens: ^4.25.2
    react-native-svg: ^15.15.5
    react-native-web: ^0.21.2
    tailwindcss: ^3.4.19
    zod: ^4.4.3
allowBuilds:
  lefthook: true
trustPolicyExclude:
  - semver@6.3.1
  - ua-parser-js@1.0.41
minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.10.2'
  - '@turbo/darwin-arm64@2.10.2'
  - '@turbo/linux-64@2.10.2'
  - '@turbo/linux-arm64@2.10.2'
  - '@turbo/windows-64@2.10.2'
  - '@turbo/windows-arm64@2.10.2'
  - '@withxat/eslint-config@1.1.5'
  - recharts@3.9.1
  - turbo@2.10.2
  - '@expo/cli@57.0.3'
  - '@expo/fingerprint@0.20.1'
  - '@expo/inline-modules@0.1.1'
  - '@expo/local-build-cache-provider@57.0.1'
  - '@expo/metro-config@57.0.2'
  - '@expo/metro-runtime@57.0.2'
  - '@expo/prebuild-config@57.0.3'
  - '@expo/router-server@57.0.1'
  - babel-preset-expo@57.0.1
  - expo-asset@57.0.2
  - expo-auth-session@57.0.1
  - expo-constants@57.0.2
  - expo-linking@57.0.1
  - expo-modules-autolinking@57.0.3
  - expo-modules-core@57.0.1
  - expo-router@57.0.2
  - expo-splash-screen@57.0.1
  - expo@57.0.1
