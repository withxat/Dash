# Free dial-tone for dash-relay — the single login / push hop for every user.
# Fails the job (and emails the repo watchers) if /health dies or OAuth stops 302'ing.
name: Relay probe

on:
  schedule:
    # Every 15 minutes. GitHub may delay cron under load; that is fine for dial-tone.
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: /health is live
        run: |
          set -euo pipefail
          body="$(curl -sfS --max-time 15 https://dash.xat.sh/health)"
          printf '%s\n' "$body" | grep -q 'Dash OAuth relay OK'

      - name: OAuth callback 302s to dash://
        run: |
          set -euo pipefail
          headers="$(curl -sS -D - -o /dev/null --max-time 15 \
            'https://dash.xat.sh/oauth/callback?code=probe&state=1')"
          printf '%s\n' "$headers" | grep -qiE '^HTTP/2 302|^HTTP/1\.1 302'
          printf '%s\n' "$headers" | grep -qiE \
            '^[Ll]ocation:[[:space:]]*dash://oauth/callback\?code=probe&state=1'
