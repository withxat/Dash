name: Web quality

on:
  pull_request:
    paths:
      - '.github/workflows/web-quality.yml'
      - 'apps/web/**'
      - 'eslint.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.json'
      - 'turbo.json'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/web-quality.yml'
      - 'apps/web/**'
      - 'eslint.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.json'
      - 'turbo.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.9.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @dash/web lint

      - name: Typecheck
        run: pnpm --filter @dash/web exec tsc -b --noEmit

      - name: Test
        run: pnpm --filter @dash/web test

      - name: Build
        run: pnpm --filter @dash/web build
