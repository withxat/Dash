name: iOS quality

on:
  pull_request:
    paths:
      - '.github/workflows/ios-quality.yml'
      - 'apps/ios/**'
      - 'packages/BlossomColorPicker/**'
      - 'packages/SwiftDitherKit/**'
      - 'packages/SwiftGlobeKit/**'
      - 'packages/cloudflare-api/**'
      - 'packages/gradient-avatars/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ios-quality.yml'
      - 'apps/ios/**'
      - 'packages/BlossomColorPicker/**'
      - 'packages/SwiftDitherKit/**'
      - 'packages/SwiftGlobeKit/**'
      - 'packages/cloudflare-api/**'
      - 'packages/gradient-avatars/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
  workflow_dispatch:
    inputs:
      suite:
        description: Test suite to run
        type: choice
        default: unit
        options:
          - unit
          - full

permissions:
  contents: read

concurrency:
  group: ios-quality-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer

jobs:
  checks:
    if: inputs.suite != 'full'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test simulator preparation
        run: node --test apps/ios/scripts/prepare-ci-simulator.test.mjs

      - name: Prepare iPhone simulator
        id: simulator
        run: node apps/ios/scripts/prepare-ci-simulator.mjs

      - name: Lint
        run: pnpm lint

      - name: Test Swift packages
        run: |
          pnpm api:test
          pnpm avatars:test
          pnpm blossom:test
          pnpm dither:test
          pnpm globe:test

      - name: Test Dash unit target
        env:
          SIMULATOR_DESTINATION: ${{ steps.simulator.outputs.destination }}
        run: |
          xcodebuild \
            -project apps/ios/Dash.xcodeproj \
            -scheme Dash \
            -destination "$SIMULATOR_DESTINATION" \
            -allowProvisioningUpdates \
            -parallel-testing-enabled NO \
            -resultBundlePath "$RUNNER_TEMP/DashTests.xcresult" \
            -only-testing:DashTests \
            test

      - name: Upload failed test results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dash-unit-test-results
          path: ${{ runner.temp }}/DashTests.xcresult
          if-no-files-found: ignore
          retention-days: 7

      - name: Simulator diagnostics
        if: failure()
        run: xcrun simctl list

  full:
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'full'
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test simulator preparation
        run: node --test apps/ios/scripts/prepare-ci-simulator.test.mjs

      - name: Prepare iPhone simulator
        id: simulator
        run: node apps/ios/scripts/prepare-ci-simulator.mjs

      - name: Run full iOS suite
        env:
          SIMULATOR_DESTINATION: ${{ steps.simulator.outputs.destination }}
        run: |
          xcodebuild \
            -project apps/ios/Dash.xcodeproj \
            -scheme Dash \
            -destination "$SIMULATOR_DESTINATION" \
            -allowProvisioningUpdates \
            -parallel-testing-enabled NO \
            -resultBundlePath "$RUNNER_TEMP/DashTests.xcresult" \
            test
          pnpm lint:l10n

      - name: Upload failed test results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dash-full-test-results
          path: ${{ runner.temp }}/DashTests.xcresult
          if-no-files-found: ignore
          retention-days: 7

      - name: Simulator diagnostics
        if: failure()
        run: xcrun simctl list
